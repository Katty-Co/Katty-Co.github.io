<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Page not found — Katty &amp; Co.</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&amp;family=Nunito:wght@400;600;700&amp;display=swap" rel="stylesheet">
<link rel="icon" href="/img/kat-logo.png" type="image/png">
<meta name="theme-color" content="#FFF4E4">
<style>
  *, *::before, *::after { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; background: #FFF4E4; color: #2B1D18;
    font-family: 'Nunito', system-ui, sans-serif; -webkit-font-smoothing: antialiased;
    display: grid; place-items: center; padding: clamp(20px, 5vw, 48px); }
  main { max-width: 620px; text-align: center; }
  .badge { width: clamp(84px, 12vw, 108px); height: clamp(84px, 12vw, 108px);
    border: 4px solid #2B1D18; border-radius: 28px; background: #F7BE45;
    display: grid; place-items: center; box-shadow: 7px 7px 0 #2B1D18;
    transform: rotate(-4deg); margin: 0 auto clamp(24px, 4vw, 34px); overflow: hidden; }
  .badge img { display: block; width: 80%; height: 80%; object-fit: contain; }
  h1 { font-family: 'Baloo 2', cursive; font-weight: 800; line-height: 1.05;
    font-size: clamp(38px, 7vw, 62px); margin: 0 0 14px; }
  p { font-size: clamp(16px, 2vw, 18px); line-height: 1.65; margin: 0 auto 30px; max-width: 46ch; }
  .links { display: flex; flex-wrap: wrap; gap: 12px; justify-content: center; }
  a.btn { padding: 14px 24px; border: 3px solid #2B1D18; border-radius: 999px;
    font-family: 'Baloo 2', cursive; font-weight: 800; font-size: 17px;
    text-decoration: none; color: #2B1D18; background: #FFFCF6;
    box-shadow: 5px 5px 0 #2B1D18; transition: transform .12s, box-shadow .12s; }
  a.btn.primary { background: #F4795B; color: #FFFCF6; }
  a.btn:hover { transform: translate(-2px, -2px); box-shadow: 7px 7px 0 #2B1D18; }
  a.btn:active { transform: translate(2px, 2px); box-shadow: 3px 3px 0 #2B1D18; }
  :focus-visible { outline: 3px solid #C9503A; outline-offset: 3px; }
</style>
</head>
<body>
<main>
  <div class="badge"><img src="/img/kat-logo.png" alt="" aria-hidden="true"></div>
  <h1>Kat ate this page.</h1>
  <p>She does that. The page you were after isn&rsquo;t here &mdash; but the dogs, the rates
     and the booking form all still are.</p>
  <div class="links">
    <a class="btn primary" href="/">Back home</a>
    <a class="btn" href="/services/">Services &amp; rates</a>
    <a class="btn" href="/booking/">Book a stay</a>
  </div>
</main>
</body>
</html>
